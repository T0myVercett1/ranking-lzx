<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>后台管理 — The Bard's Blind Ranking</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/vintage.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="page-header">
      <div class="container">
        <a href="index.html" class="back-link">← 返回首页</a>
        <h1>⚙ 后台管理</h1>
        <p class="subtitle">编辑莎士比亚剧目池</p>
      </div>
    </header>

    <main class="page-main">
      <div class="container">
        <!-- 说明 -->
        <div class="card" style="margin-bottom: var(--space-xl);">
          <p style="margin-bottom: 0;">
            📝 编辑以下 10 部剧目。<strong>必须是恰好 10 部</strong>，不能有空名、不能重复。
            修改后点击"保存"生效，下一局游戏将使用新剧目池。
          </p>
        </div>

        <!-- 剧目编辑列表 -->
        <div class="card card--accent" id="pool-editor">
          <div class="form-error" id="form-error" style="display:none; margin-bottom: var(--space-md);"></div>
          <div id="play-inputs"></div>

          <div class="admin-actions">
            <button type="button" class="btn btn--primary" id="btn-save">💾 保存剧目池</button>
            <button type="button" class="btn btn--secondary" id="btn-reset">🔄 恢复默认</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="modal-confirm">
      <div class="modal">
        <h3 class="modal__title">确认重置</h3>
        <p class="modal__body">将剧目池恢复为默认的 10 部莎士比亚经典剧目？<br>当前修改将丢失。</p>
        <div class="modal__actions">
          <button class="btn btn--secondary" id="modal-cancel">取消</button>
          <button class="btn btn--accent" id="modal-confirm-btn">确认重置</button>
        </div>
      </div>
    </div>

    <footer class="page-footer">
      <div class="container">
        <p class="text-center" style="font-size: var(--text-xs);">默认剧目池改编自莎士比亚经典作品</p>
      </div>
    </footer>
  </div>

  <script src="js/storage/storage.js"></script>
  <script src="js/pages/admin.js"></script>
</body>
</html>
